name: Gerar APK Automático

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Configurar o Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Buildozer e dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev libc6-dev libbz2-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Criar ficheiro buildozer.spec padrão
      run: |
        buildozer init
        sed -i 's/^title = .*/title = Somavilla Barbearia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = somavillabarber/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.somavilla/' buildozer.spec

    - name: Compilar o APK com Buildozer
      run: |
        yes y | buildozer -v android debug

    - name: Guardar e Disponibilizar o APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Somavilla-Barbearia
        path: bin/*.apk
        
